# Local development database only. The app itself runs directly with uv.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: swordbot
      POSTGRES_PASSWORD: swordbot
      POSTGRES_DB: swordbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swordbot"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
